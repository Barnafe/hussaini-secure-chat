# Render "Blueprint" - lets Render create the web service from this repository.
# (You can also create the service by hand in the dashboard; see README section 5.)
services:
  - type: web
    name: hussaini-secure-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # paste your Neon connection string in the Render dashboard
        sync: false
      - key: BCRYPT_ROUNDS
        value: "12"
